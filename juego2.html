<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Preguntas</title>
    <link rel="stylesheet" href="juego2.css">
    
  
</head>
<body>
    <div id="quiz-container">
        <h2>¿Cuál es la repuesta correcta?</h2>
        <ul class="options">
            <li><input type="radio" name="q1" value="1">El ɘrizo es lindo</li>
            <li><input type="radio" name="q1" value="2">El erizo es lindo</li>
            <li><input type="radio" name="q1" value="3">El erizo es linbo</li>
        </ul>
        <button onclick="verificarRespuesta()">Verificar</button> 
        <button class="boton" id="next-button" onclick="siguientePregunta()">></button>
        <p id="result"></p>
    </div>
      

    <div id="quiz-container2" style="display:none;">
        <h2>¿Cuál es la repuesta correcta?</h2>
        <ul class="options">
            <li><input type="radio" name="q2" value="1">La tortuga nabaora</li>
            <li><input type="radio" name="q2" value="2">La tortvga nadadora</li>
            <li><input type="radio" name="q2" value="3">La tortuga nadadora</li>
        </ul>
        <button onclick="verificarRespuesta2()">Verificar</button>
        <button class="boton" id="prev-button" onclick="anteriorPregunta()"><</button>
        <p id="result2"></p>
    </div>



     <script>
        var preguntaActual = 1;

        function verificarRespuesta() {
            var respuestaCorrecta = "2"; // Respuesta correcta
            var respuestaUsuario = document.querySelector('input[name="q1"]:checked');

            if (respuestaUsuario) {
                if (respuestaUsuario.value === respuestaCorrecta) {
                    document.getElementById("result").textContent = "¡Respuesta correcta!";
                    
                } else {
                    document.getElementById("result").textContent = "Respuesta incorrecta. Intenta de nuevo.";
                    
                }
            } else {
                document.getElementById("result").textContent = "Por favor, selecciona una respuesta.";
                document.getElementById("next-button").style.display = "none";
            }

            document.getElementById("result").style.display = "block";
        }

        function siguientePregunta() {
            document.getElementById("quiz-container").style.display = "none";
            document.getElementById("quiz-container2").style.display = "block";
            preguntaActual = 2;
        }

        function verificarRespuesta2() {
            var respuestaCorrecta = "3"; // Respuesta correcta
            var respuestaUsuario = document.querySelector('input[name="q2"]:checked');

            if (respuestaUsuario) {
                if (respuestaUsuario.value === respuestaCorrecta) {
                    document.getElementById("result2").textContent = "¡Respuesta correcta!";
                } else {
                    document.getElementById("result2").textContent = "Respuesta incorrecta. Intenta de nuevo.";
                }
            } else {
                document.getElementById("result2").textContent = "Por favor, selecciona una respuesta.";
            }

            document.getElementById("result2").style.display = "block";
        }

        function anteriorPregunta() {
            document.getElementById("quiz-container").style.display = "block";
            document.getElementById("quiz-container2").style.display = "none";
            preguntaActual = 1;
        }
    </script>
</body>
</html>
